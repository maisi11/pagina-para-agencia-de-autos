
services:
  postgres:
    image: postgres:17
    container_name: postgres-prisma
    restart: unless-stopped
    environment:
      POSTGRES_DB: prisma_db_concesionaria
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ManoloDBA13
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d prisma_db"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
